<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Pedidos</title>

    <link rel="stylesheet"
          th:href="@{/css/bootstrap.min.css}">
</head>

<body>

<div class="container mt-5">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <h1>Pedidos</h1>

        <a th:href="@{/pedidos/novo}"
           class="btn btn-primary">
            Novo Pedido
        </a>

    </div>

    <div class="alert alert-info"
         th:if="${#lists.isEmpty(pedidos)}">
        Nenhum pedido cadastrado.
    </div>

    <table class="table table-striped table-hover"
           th:if="${!#lists.isEmpty(pedidos)}">

        <thead>

        <tr>
            <th>ID</th>
            <th>Cliente</th>
            <th>Data</th>
            <th>Status</th>
            <th>Total</th>
            <th>Ações</th>
        </tr>

        </thead>

        <tbody>

        <tr th:each="pedido : ${pedidos}">

            <td th:text="${pedido.id}"></td>

            <td th:text="${pedido.cliente.nome}"></td>

            <td th:text="${#temporals.format(
                pedido.dataPedido,
                'dd/MM/yyyy HH:mm'
            )}">
            </td>

            <td th:text="${pedido.status}"></td>

            <td th:text="${'R$ ' + pedido.valorTotal}"></td>

            <td>

                <a th:href="@{/pedidos/detalhes/{id}(id=${pedido.id})}"
                   class="btn btn-info btn-sm">
                    Detalhes
                </a>

                <a th:if="${pedido.status.name() == 'ATIVO'}"
                   th:href="@{/pedidos/edit/{id}(id=${pedido.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <a th:if="${pedido.status.name() == 'ATIVO'}"
                   th:href="@{/pedidos/cancelar/{id}(id=${pedido.id})}"
                   class="btn btn-danger btn-sm">
                    Cancelar
                </a>

            </td>

        </tr>

        </tbody>

    </table>

</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>

</body>
</html>
