<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar</title>
    <link rel="stylesheet" th:href="@{/css/bootstrap.min.css}">
</head>
<body>
<div class="container mt-5" style="max-width: 480px;">
    <h1 class="mb-4">Sistema de Vendas</h1>
    <div class="alert alert-danger" th:if="${param.erro}">E-mail ou senha inválidos.</div>
    <div class="alert alert-success" th:if="${param.logout}">Sessão encerrada com sucesso.</div>
    <form th:action="@{/login}" method="post">
        <div class="mb-3">
            <label for="email" class="form-label">E-mail</label>
            <input id="email" name="username" type="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="senha" class="form-label">Senha</label>
            <input id="senha" name="password" type="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary">Entrar</button>
    </form>
</div>
</body>
</html>
